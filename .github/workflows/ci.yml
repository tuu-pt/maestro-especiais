name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tipos, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            tools/requirements.txt
      - run: pip install -e "backend[dev]" -r tools/requirements.txt
      - run: ruff check backend tools
      - run: ruff format --check backend tools
      - run: mypy backend/app backend/tests
      - run: mypy tools
      - run: pytest

  frontend:
    name: Frontend (lint, tipos, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  stack:
    name: Docker Compose (stack completa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python tools/make_dev_env.py
      - run: docker compose up -d --build --wait
      - run: pip install -e "backend[dev]"
      - run: pytest -m integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  pii-check:
    name: Dados pessoais nas fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: data/private nunca é versionado
        run: |
          if [ -n "$(git ls-files data/private)" ]; then
            echo "Há ficheiros de data/private no Git." >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/anonymize.py --check data/fixtures
