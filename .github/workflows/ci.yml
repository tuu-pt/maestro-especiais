name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tipos, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro-ci
          POSTGRES_DB: maestro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maestro" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://maestro:maestro-ci@localhost:5432/maestro_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            tools/requirements.txt
      - run: pip install -e "backend[dev]" -r tools/requirements.txt
      - name: LibreOffice (verificação de fidelidade das peças exportadas)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui fonts-dejavu-core
      - run: ruff check backend tools
      - run: ruff format --check backend tools
      - run: mypy backend/app backend/tests
      - run: mypy tools
      - run: pytest

  frontend:
    name: Frontend (lint, tipos, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  stack:
    name: Docker Compose (stack completa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python tools/make_dev_env.py
      - run: docker compose up -d --build --wait
      - run: pip install -e "backend[dev]"
      - run: pytest -m integration backend/tests
        env:
          RUN_INGEST_E2E: "1"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  compat:
    # The TUU VPS: Postgres 18.6, Node 22, Debian 12 (CLAUDE.md). Nothing is deployed from here:
    # it only proves that what we build today still moves to those versions.
    name: Compatibilidade com a VPS (Postgres 18, Node 22, Debian 12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro-ci
          POSTGRES_DB: maestro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maestro" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://maestro:maestro-ci@localhost:5432/maestro_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Backend (migrações e testes) em Postgres 18 + pgvector
        run: pytest backend/tests
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (testes e build) em Node 22
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Imagem do backend em Debian 12
        run: |
          docker build --build-arg BASE_IMAGE=python:3.12-slim-bookworm -t backend-bookworm backend
          docker run --rm backend-bookworm sh -c 'grep -q "^12" /etc/debian_version && python -c "import app.main, app.ingest.readers, pypdfium2"'

  pii-check:
    name: Dados pessoais nas fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: data/private nunca é versionado
        run: |
          if [ -n "$(git ls-files data/private)" ]; then
            echo "Há ficheiros de data/private no Git." >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/anonymize.py --check data/fixtures
      - run: python tools/anonymize.py --check backend/app/forms/templates
