[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-especiais-backend"
version = "0.0.1"
description = "Maestro Especiais API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "boto3==1.43.101",
  "alembic==1.20.0",
  "python-multipart==0.0.32",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "rq==2.12.0",
  "sse-starlette==3.4.11",
  "pyyaml==6.0.3",
  "pypdfium2==5.13.0",
  "python-docx==1.2.0",
  "google-genai==2.25.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "moto[s3]==5.2.3",
  "xlwt==1.3.0",
  "fakeredis==2.38.0",
  "types-openpyxl==3.1.5.20260827",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ingest" = ["maps/*.yaml"]
"app.llm" = ["whitelist.yaml", "prompts/*.md"]
"app.forms" = ["templates/*.xlsm", "templates/*.docx"]

# pytest, ruff and mypy are configured at the repository root.
