# Development stack. Secrets come from .env (create it with `make env`).
name: maestro-especiais

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env (make env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (make env)}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env (make env)}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env (make env)}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible store for development (the MinIO images are no longer published).
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      # Read by `weed s3` when there is no S3 configuration file: one admin identity.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY no .env (make env)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no .env (make env)}
    volumes:
      - s3-data:/data
    ports:
      # Only the S3 API: the web interfaces have no authentication.
      - "${S3_HOST_PORT:-59000}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-maestro-especiais}
      S3_CREATE_BUCKET: "true"
      DEV_AUTH: "true"
      FIXTURES_ROOT: /srv/data/fixtures
      # LLM (SPEC 6.1): the key and the model names only in the .env
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_DRAFTING: ${LLM_MODEL_DRAFTING:-}
      LLM_MODEL_EXTRACTION: ${LLM_MODEL_EXTRACTION:-}
      LLM_RPM: ${LLM_RPM:-10}
      LLM_RPD: ${LLM_RPD:-200}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL_DRAFTING: ${LLM_FALLBACK_MODEL_DRAFTING:-}
      LLM_FALLBACK_MODEL_EXTRACTION: ${LLM_FALLBACK_MODEL_EXTRACTION:-}
      LLM_FALLBACK_RPM: ${LLM_FALLBACK_RPM:-2}
    volumes:
      - ./backend/app:/srv/backend/app:ro
      - ./backend/migrations:/srv/backend/migrations:ro
      # anonymized reference projects, read by make seed-library (never data/private)
      - ./data/fixtures:/srv/data/fixtures:ro
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ./backend
    command: ["rq", "worker", "ingest", "llm", "validation", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0"]
    environment:
      # The mounted code, not the copy installed in the image (rq does not add the workdir).
      PYTHONPATH: /srv/backend
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-maestro-especiais}
      # LLM (SPEC 6.1): the key and the model names only in the .env
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_DRAFTING: ${LLM_MODEL_DRAFTING:-}
      LLM_MODEL_EXTRACTION: ${LLM_MODEL_EXTRACTION:-}
      LLM_RPM: ${LLM_RPM:-10}
      LLM_RPD: ${LLM_RPD:-200}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL_DRAFTING: ${LLM_FALLBACK_MODEL_DRAFTING:-}
      LLM_FALLBACK_MODEL_EXTRACTION: ${LLM_FALLBACK_MODEL_EXTRACTION:-}
      LLM_FALLBACK_RPM: ${LLM_FALLBACK_RPM:-2}
    volumes:
      - ./backend/app:/srv/backend/app:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rq", "info", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0", "--only-workers"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_POLLING: "true"
    volumes:
      - ./frontend/src:/srv/frontend/src:ro
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine localhost resolves to ::1 and Vite listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  s3-data:
