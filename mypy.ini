[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

# PyMuPDF ships no type hints for Pixmap and friends.
[mypy-anonymizer.images,anonymizer.pdf,synthetic,test_ooxml,test_pdf,test_cli]
disallow_untyped_calls = False
