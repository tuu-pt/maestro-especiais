[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-xlrd.*,xlwt.*,xlutils.*,pypdfium2,pypdfium2.*]
ignore_missing_imports = True

# PyMuPDF has partial, inaccurate hints: treat it as untyped.
[mypy-pymupdf,pymupdf.*]
follow_imports = skip
ignore_missing_imports = True
