target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF"]

[lint.isort]
known-first-party = ["app", "anonymizer"]

[lint.per-file-ignores]
# Detectors match typographic characters on purpose (’ ′ – …).
"tools/anonymizer/**" = ["RUF001", "RUF003"]
"tools/tests/**" = ["RUF001", "RUF003"]
